  - case_id: fcra_deep_missing_forwarded_bank_statement
    title: Bank statement not forwarded to furnisher
    narrative: >
      The consumer disputed a charged-off credit card balance and attached bank
      statements plus a creditor letter showing a settlement payment. The CRA
      coded the dispute and sent a generic "claims paid" code to the furnisher
      on day 4, but the processing log says the document images were not sent or
      made available. The furnisher verified the old balance. The CRA completed
      within 29 days and sent a timely results notice.
