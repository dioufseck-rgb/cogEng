workspace_name: FCRA Credit Reporting Dispute Deep Benchmark
policy_title: FCRA credit reporting dispute reinvestigation
policy_id: fcra_credit_reporting_dispute_deep
version_label: FCRA 1681i, 1681s-2, Regulation V bounded benchmark
metadata:
  purpose: >
    Deep, realistic credit-reporting dispute benchmark for testing governed
    Map plus deterministic RuleKit execution against direct LLM disposition.
  legal_scope_note: >
    This is an engineering benchmark, not legal advice and not a complete FCRA
    compliance program. It models selected public-law duties for consumer
    reporting agency disputes, furnisher indirect disputes, furnisher direct
    disputes, reseller routing, reinsertion, consumer statements, and routing
    review triggers.
  primary_sources:
    - 15 U.S.C. 1681i
    - 15 U.S.C. 1681s-2
    - 12 CFR 1022.43
  perspectives:
    - perspective_id: bank_furnisher
      label: Bank as furnisher and direct-dispute recipient
      actor: bank
      role: furnisher
      description: >
        Role-scoped view for a bank that furnishes account information to CRAs
        and may receive either CRA-transmitted indirect disputes or direct
        consumer disputes at its published dispute address.
      primary_determinations:
        - fcra.furnisher_indirect_satisfied
        - fcra.direct_furnisher_satisfied
      support_determinations:
        - fcra.cra_furnisher_notice_satisfied
        - fcra.item_treatment_satisfied
      routing_determinations:
        - fcra.human_review_required
      evidence_duties:
        - Identify whether the dispute arrived through a CRA notice, directly from the consumer, or both.
        - Confirm whether the bank received all relevant information transmitted by the CRA.
        - Review account records, payment history, consumer documents, and CRA-transmitted material.
        - Report investigation results to the CRA when the dispute is indirect.
        - Report direct-dispute results to the consumer when the dispute is direct.
        - Correct, delete, block, or report corrections when information is inaccurate, incomplete, or unverifiable.
        - Route identity-theft, mixed-file, litigation, conflicting-document, and missing-source-document cases to review.
      map_profile_rule_ids:
        - ordinary_furnisher_indirect_completed
        - direct_furnisher_notice_path
        - no_direct_furnisher_dispute_mentioned
        - no_cra_path_for_direct_furnisher_only
        - manual_review_for_forwarding_failure
    - perspective_id: cra_dispute
      label: CRA reinvestigation and dispute-processing view
      actor: consumer_reporting_agency
      role: cra
      description: >
        Role-scoped view for the CRA's reinvestigation, forwarding, notice,
        reinsertion, consumer-statement, and overall dispute-resolution duties.
      primary_determinations:
        - fcra.cra_reinvestigation_trigger_valid
        - fcra.frivolous_termination_valid
        - fcra.cra_reinvestigation_required
        - fcra.cra_reinvestigation_timely
        - fcra.cra_furnisher_notice_satisfied
        - fcra.cra_consideration_satisfied
        - fcra.item_treatment_satisfied
        - fcra.results_notice_satisfied
        - fcra.reinsertion_satisfied
        - fcra.reseller_satisfied
        - fcra.consumer_statement_satisfied
        - fcra.dispute_resolution_compliant
      routing_determinations:
        - fcra.human_review_required
  map_profile:
    default_rules:
      - id: no_frivolous_termination_mentioned
        kind: scoped_absence
        atom_ids:
          - fcra.frivolous_determination_made
          - fcra.frivolous_notice_sent
          - fcra.frivolous_reason_identified
          - fcra.frivolous_missing_info_identified
        value: false
        basis: explicit_negative
        unless_any: [frivolous, irrelevant, duplicate]
        evidence: Narrative does not state a frivolous or irrelevant termination.
      - id: no_reseller_branch_mentioned
        kind: branch_not_applicable
        atom_ids:
          - fcra.notice_through_reseller
          - fcra.reseller_received_dispute
          - fcra.reseller_item_due_to_reseller_error
          - fcra.reseller_corrected_or_deleted
          - fcra.reseller_conveyed_to_cra
          - fcra.reseller_reconveyed_results_to_consumer
          - fcra.reseller_reinvestigation_chosen
        value: false
        basis: explicit_negative
        unless_any: [reseller, tenant-screening]
        evidence: Narrative does not describe reseller involvement.
      - id: no_reinsertion_branch_mentioned
        kind: branch_not_applicable
        atom_ids:
          - fcra.item_reinserted
          - fcra.furnisher_certified_accuracy_for_reinsertion
          - fcra.reinsertion_notice_sent
          - fcra.reinsertion_notice_identifies_furnisher
          - fcra.reinsertion_notice_includes_statement_right
          - fcra.deleted_item_reappeared_without_certification
        value: false
        basis: explicit_negative
        unless_any: [reinserted, reinsertion, reappeared, reappears]
        evidence: Narrative does not describe deletion followed by reinsertion or reappearance.
      - id: no_consumer_statement_mentioned
        kind: branch_not_applicable
        atom_ids:
          - fcra.consumer_statement_filed
          - fcra.subsequent_reports_note_dispute
        value: false
        basis: explicit_negative
        unless_any: [consumer statement, statement of dispute]
        evidence: Narrative does not state that a consumer statement was filed.
      - id: no_direct_furnisher_dispute_mentioned
        kind: branch_not_applicable
        atom_ids:
          - fcra.direct_dispute_received_by_furnisher
          - fcra.direct_dispute_at_proper_address
          - fcra.direct_dispute_identifies_account
          - fcra.direct_dispute_identifies_specific_info
          - fcra.direct_dispute_explains_basis
          - fcra.direct_dispute_supporting_docs_supplied
          - fcra.direct_dispute_public_record_only
          - fcra.direct_dispute_fraud_alert_only
          - fcra.direct_furnisher_investigation_conducted
          - fcra.direct_furnisher_reviewed_info
          - fcra.direct_furnisher_results_reported_to_consumer
          - fcra.direct_furnisher_corrected_cras
        value: false
        basis: explicit_negative
        unless_any: [direct dispute, furnisher's published dispute address, furnisher dispute address]
        evidence: Narrative does not describe a direct dispute sent to the furnisher.
      - id: ordinary_cra_dispute_trigger
        kind: scope_supported_true
        atom_ids:
          - fcra.consumer_disputed_item
          - fcra.item_in_consumer_file
          - fcra.dispute_about_accuracy
          - fcra.consumer_identity_sufficient
          - fcra.account_identified
          - fcra.disputed_field_identified
          - fcra.basis_explained
          - fcra.consumer_submission_authentic
        value: true
        basis: inferred_from_record
        if_any: [consumer disputed, disputed a, disputes]
        evidence: Narrative describes a consumer dispute identifying an item and basis.
      - id: direct_cra_notice
        kind: scope_supported_true
        atom_ids:
          - fcra.notice_direct_to_cra
        value: true
        basis: inferred_from_record
        if_any: [CRA file shows the dispute was received directly, received directly, dispute was received directly, CRA coded, CRA log, CRA has not yet received]
        evidence: Narrative states direct CRA receipt.
      - id: ordinary_cra_review_completed
        kind: scope_supported_true
        atom_ids:
          - fcra.cra_reviewed_all_consumer_info
          - fcra.cra_considered_primary_source_documents
          - fcra.cra_compared_furnisher_response
          - fcra.cra_compared_own_file
          - fcra.cra_reasonable_reinvestigation_performed
          - fcra.dispositive_info_not_ignored
          - fcra.human_review_of_documents_performed
        value: true
        basis: inferred_from_record
        if_any: [reviewed the consumer ledger against the furnisher payment history, reviewed consumer ledger, compared, sent complete written results]
        unless_any: [not sent or made available, not forwarded, not yet received enough material]
        evidence: Narrative describes ordinary-course review of consumer and furnisher information.
      - id: ordinary_verified_item_treatment
        kind: scope_supported_true
        atom_ids:
          - fcra.item_verified_as_accurate
          - fcra.item_status_recorded_current
        value: true
        basis: inferred_from_record
        if_any: [recorded the item as verified, verifying the late payment]
        evidence: Narrative states the item was verified and recorded.
      - id: ordinary_results_notice_complete
        kind: scope_supported_true
        atom_ids:
          - fcra.results_notice_sent
          - fcra.notice_states_reinvestigation_completed
          - fcra.revised_consumer_report_provided
          - fcra.procedure_description_right_disclosed
          - fcra.furnisher_contact_disclosed_if_available
          - fcra.consumer_statement_right_disclosed
          - fcra.notification_right_disclosed
        value: true
        basis: inferred_from_record
        if_any: [mailed results with the revised report, sent complete written results, otherwise complete results notice]
        evidence: Narrative describes a complete written results notice with revised report.
      - id: ordinary_furnisher_indirect_completed
        kind: scope_supported_true
        atom_ids:
          - fcra.furnisher_received_cra_notice
          - fcra.furnisher_investigation_conducted
          - fcra.furnisher_reviewed_all_cra_info
          - fcra.furnisher_reported_results_to_cra
        value: true
        basis: inferred_from_record
        if_any: [received a furnisher response verifying, furnisher response verifying, furnisher verified]
        unless_any: [not sent or made available, not forwarded]
        evidence: Narrative describes furnisher response to CRA dispute notice.
      - id: reseller_notice_path
        kind: scope_supported_true
        atom_ids:
          - fcra.notice_through_reseller
          - fcra.reseller_received_dispute
        value: true
        basis: explicit_positive
        if_any: [reseller, tenant-screening]
        evidence: Narrative describes reseller receipt of the dispute.
      - id: direct_furnisher_notice_path
        kind: scope_supported_true
        atom_ids:
          - fcra.direct_dispute_received_by_furnisher
          - fcra.direct_dispute_at_proper_address
          - fcra.direct_dispute_identifies_account
          - fcra.direct_dispute_identifies_specific_info
          - fcra.direct_dispute_explains_basis
          - fcra.direct_dispute_supporting_docs_supplied
          - fcra.direct_dispute_subject_within_scope
        value: true
        basis: explicit_positive
        if_any: [furnisher's published dispute address, direct dispute to the furnisher]
        evidence: Narrative describes a qualifying direct furnisher dispute packet.
      - id: no_cra_path_for_direct_furnisher_only
        kind: branch_not_applicable
        atom_ids:
          - fcra.notice_direct_to_cra
          - fcra.notice_through_reseller
        value: false
        basis: explicit_negative
        if_any: [furnisher's published dispute address, direct dispute to the furnisher]
        unless_any: [CRA file shows, source CRA, through a tenant-screening reseller]
        evidence: Narrative describes only a direct-to-furnisher dispute, not CRA receipt.
      - id: primary_documents_not_forwarded
        kind: explicit_negative
        atom_ids:
          - fcra.primary_documents_forwarded
          - fcra.notice_included_all_relevant_info
          - fcra.cra_considered_primary_source_documents
          - fcra.dispositive_info_not_ignored
        value: false
        basis: explicit_negative
        if_any: [not sent or made available, were not sent, were not forwarded]
        evidence: Narrative states primary documents were not forwarded or made available.
      - id: automated_code_only_from_generic_code
        kind: explicit_positive
        atom_ids:
          - fcra.automated_code_only
        value: true
        basis: explicit_positive
        if_any: [generic "claims paid" code, coded the dispute]
        evidence: Narrative describes generic dispute coding.
      - id: manual_review_for_forwarding_failure
        kind: routing_trigger
        atom_ids:
          - fcra.manual_review_policy_trigger
          - fcra.conflicting_furnisher_and_consumer_docs
        value: true
        basis: inferred_from_record
        if_any: [not sent or made available, old balance despite settlement documents]
        evidence: Missing primary-document forwarding and contrary furnisher verification trigger review.
      - id: not_mine_identity_route
        kind: routing_trigger
        atom_ids:
          - fcra.consumer_alleges_not_mine
        value: true
        basis: explicit_positive
        if_any: [not mine, not belonging to the consumer]
        evidence: Narrative contains a not-mine dispute.
      - id: identity_theft_route
        kind: routing_trigger
        atom_ids:
          - fcra.identity_theft_claimed
        value: true
        basis: explicit_positive
        if_any: [identity theft]
        evidence: Narrative mentions identity theft.
      - id: mixed_file_route
        kind: routing_trigger
        atom_ids:
          - fcra.mixed_file_claimed
        value: true
        basis: inferred_from_record
        if_any: [mixed-file, similar name]
        evidence: Narrative describes mixed-file or similar-name evidence.
      - id: missing_identity_theft_report
        kind: routing_trigger
        atom_ids:
          - fcra.identity_theft_report_supplied
        value: false
        basis: explicit_negative
        if_any: [not the actual identity theft report, affidavit is being prepared]
        evidence: Narrative states identity theft documentation is incomplete.
      - id: source_gap_route
        kind: routing_trigger
        atom_ids:
          - fcra.source_documents_missing
        value: true
        basis: explicit_positive
        if_any: [not yet received enough material, not the actual identity theft report]
        evidence: Narrative states source material is missing.
      - id: material_date_conflict_route
        kind: routing_trigger
        atom_ids:
          - fcra.material_date_conflict
        value: true
        basis: explicit_positive
        if_any: [inconsistent dates]
        evidence: Narrative states material dates are inconsistent.
      - id: human_review_from_routing_cues
        kind: routing_trigger
        atom_ids:
          - fcra.manual_review_policy_trigger
        value: true
        basis: inferred_from_record
        if_any: [not mine, identity theft, mixed-file, similar name, not yet received enough material, inconsistent dates]
        evidence: Narrative contains a routing cue requiring human review.
policy_text: |
  Bounded benchmark policy for consumer reporting disputes.

  1. Consumer reporting agency reinvestigation trigger. If the completeness or
  accuracy of an item in a consumer's file is disputed by the consumer and the
  consumer reporting agency receives notice directly or through a reseller, the
  agency must conduct a reasonable reinvestigation unless a valid frivolous or
  irrelevant termination applies. A valid dispute packet identifies the consumer,
  identifies the account or item, identifies the disputed field or information,
  and explains the basis for the dispute.

  2. Time to complete reinvestigation. The agency must complete the
  reinvestigation within 30 calendar days after receipt of the dispute notice.
  The period may extend to 45 days if the consumer provides additional relevant
  information during the initial 30-day period. The extension does not apply
  where the agency determines within the initial period that the item is
  inaccurate, incomplete, or cannot be verified.

  3. Furnisher notice by the agency. Before the end of the fifth business day
  after receiving the consumer's dispute, the agency must notify the furnisher
  of the disputed information when the item was provided by a furnisher, and the
  notice must include all relevant information received from the consumer. Later
  relevant information received during the reinvestigation period must be
  promptly provided to the furnisher. Primary source documents submitted by the
  consumer, such as bank statements, creditor letters, account statements,
  police reports, identity theft affidavits, court orders, or billing
  statements, are relevant when they bear on the disputed information.

  4. Consideration and reasonableness. The agency must review and consider all
  relevant consumer information. A reasonable reinvestigation compares the
  consumer submission, furnisher response, agency file, prior dispute history
  where relevant, and public-record source where relevant. Automated dispute
  coding alone is not sufficient when primary documents or material conflicts
  require review.

  5. Treatment of inaccurate, incomplete, or unverifiable information. If the
  item is inaccurate, incomplete, or cannot be verified, the agency must delete
  or modify it as appropriate and record the current status. If no defect is
  found after a reasonable reinvestigation, the item may remain verified.

  6. Results notice. Within 5 business days after completing the
  reinvestigation, the agency must provide written results to the consumer. The
  notice must state that the reinvestigation is completed, include a consumer
  report based on the revised file, disclose the right to request a description
  of the procedure used, disclose furnisher contact information if reasonably
  available, disclose the right to add a consumer statement, and disclose the
  right to request notification of deletion or dispute notation.

  7. Reinsertion. Deleted information may not be reinserted unless the furnisher
  certifies that it is complete and accurate. If reinserted, the agency must
  notify the consumer in writing within 5 business days, identify the furnisher,
  provide the consumer's right to add a statement, and maintain reasonable
  procedures designed to prevent improper reappearance.

  8. Frivolous or irrelevant disputes. The agency may terminate a
  reinvestigation if it reasonably determines that the dispute is frivolous or
  irrelevant, including because the consumer failed to provide sufficient
  information to investigate. The agency must notify the consumer within 5
  business days after that determination, provide the reasons, and identify any
  information required to investigate.

  9. Reseller disputes. A reseller receiving a dispute must determine within 5
  business days whether the item is incomplete or inaccurate because of a
  reseller act or omission. If so, the reseller must correct or delete within 20
  days. If not, the reseller must convey the dispute and all relevant consumer
  information to the consumer reporting agency that supplied the information and
  reconvey the agency's completion notice to the consumer.

  10. Furnisher duties after agency notice. A furnisher receiving agency notice
  of a dispute must investigate the disputed information, review all relevant
  information provided by the agency, report results to the agency, report
  incomplete or inaccurate findings to other nationwide consumer reporting
  agencies to which it furnished the information, and modify, delete, or
  permanently block information that is inaccurate, incomplete, or unverifiable.
  The furnisher must complete those actions before the agency's applicable
  reinvestigation deadline.

  11. Furnisher direct disputes. A furnisher receiving a qualifying direct
  dispute must investigate when the notice is sent to a proper address, identifies
  the account or relationship, identifies the specific disputed information,
  explains the basis for the dispute, includes reasonably required supporting
  documentation, and concerns covered account or relationship information. The
  furnisher need not investigate direct disputes outside the regulatory scope,
  including disputes solely about public records, fraud alerts, active duty
  alerts, information from another furnisher, or disputes reasonably believed to
  be submitted by a credit repair organization. A furnisher that invokes a
  frivolous or irrelevant direct-dispute determination must notify the consumer
  within 5 business days, state reasons, and identify information needed to
  investigate.

  12. Consumer statement and subsequent reporting. If the reinvestigation does
  not resolve the dispute and the consumer files a brief statement, subsequent
  reports containing the disputed information must clearly note that it is
  disputed and include the statement or an accurate codification or summary,
  unless there are reasonable grounds to believe the statement is frivolous or
  irrelevant.

  13. Human-review routing. Human review is required when material evidence
  conflicts remain unresolved, identity theft or mixed-file evidence is
  plausible but incomplete, a court order or legal-liability issue changes the
  ordinary fact-verification path, a veteran medical debt claim may require the
  special deletion process, primary source documents are missing from the record,
  material dates conflict, or the institution's manual review policy is
  triggered.
