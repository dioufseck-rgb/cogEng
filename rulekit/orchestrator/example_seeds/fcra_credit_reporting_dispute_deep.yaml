cases:
  - case_id: fcra_deep_clean_verified
    title: Clean verified auto-loan dispute
    narrative: >
      The consumer disputed a 30-day late notation on an auto loan. The CRA
      file shows the dispute was received directly on March 1, the account and
      month were identified, and the consumer supplied a servicer payment
      ledger. The CRA sent the dispute and document image to the furnisher on
      the third business day, completed the reinvestigation in 24 calendar days,
      received a furnisher response verifying the late payment, reviewed the
      consumer ledger against the furnisher payment history, recorded the item
      as verified, and mailed results with the revised report 4 business days
      after completion.
    expected_outcomes: &clean_expected
      fcra.cra_reinvestigation_trigger_valid: "true"
      fcra.frivolous_termination_valid: "false"
      fcra.cra_reinvestigation_required: "true"
      fcra.cra_reinvestigation_timely: "true"
      fcra.cra_furnisher_notice_satisfied: "true"
      fcra.cra_consideration_satisfied: "true"
      fcra.item_treatment_satisfied: "true"
      fcra.results_notice_satisfied: "true"
      fcra.reinsertion_satisfied: "true"
      fcra.furnisher_indirect_satisfied: "true"
      fcra.direct_furnisher_satisfied: "true"
      fcra.reseller_satisfied: "true"
      fcra.consumer_statement_satisfied: "true"
      fcra.dispute_resolution_compliant: "true"
      fcra.human_review_required: "false"
    structured_fields: &base_structured
      evidence_sources:
        - {source_id: consumer_dispute, source_type: consumer_dispute_letter, title: Consumer dispute letter, closed_world_scopes: [consumer_dispute_packet]}
        - {source_id: cra_log, source_type: cra_dispute_processing_log, title: CRA dispute processing log, closed_world_scopes: [cra_processing_dates, cra_actions]}
        - {source_id: furnisher_acdv, source_type: furnisher_dispute_response, title: Furnisher dispute response, closed_world_scopes: [furnisher_response]}
        - {source_id: results_notice, source_type: cra_results_notice, title: CRA results notice, closed_world_scopes: [results_notice]}
      facts:
        fcra.days_to_complete_reinvestigation: 24
        fcra.business_days_to_notify_furnisher: 3
        fcra.business_days_to_results_notice: 4
        fcra.days_to_furnisher_complete: 18
